<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redefinição de Senha</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/reset.css">
    <link rel="stylesheet" href="../assets/css/redefinir_senha.css">
    <link rel="stylesheet" href="../assets/css/modalrecover.css">
     <!-- LINKS DO "X" PRA FECHAR O MODAL E DA FOLHA DE ESTILO DO MODAL -->
     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
     <link rel="stylesheet" href="../assets/css/modal_redefinir_senha.css">
    <link rel="stylesheet" href="../assets/css/modalsair.css">

</head>
<body>

    <header class="container-header">
        <div class="logo">
            <img src="../assets/img/logo.png" alt="Logo CashHive">
        </div>
        <div class="user">
            <p id="user-info">Carregando usuário...</p>
            <script src="../assets/js/get-username.js" defer></script>
        </div>
    </header>

    <div class="main-container">
        <aside class="menu">
            <nav class="nav">
                <ul>
                    <li>
                        <img src="../assets/img/homeicon.svg" alt="Início">
                        <a href="#">Página inicial</a>
                    </li>
                    <li>
                        <img src="../assets/img/profileicon.svg" alt="Perfil">
                        <a href="../public/profile.html">Perfil</a>
                    </li>
                    <li>
                        <details class="submenu">
                            <summary>
                                <img src="../assets/img/financeicon.svg" alt="Financeiro">
                                Financeiro
                            </summary>
                            <ul>
                                <li><a href="#">Receitas</a></li>
                                <li><a href="#">Cadastro de Receitas</a></li>
                                <li><a href="#">Despesas</a></li>
                                <li><a href="#">Cadastro de Despesas</a></li>
                            </ul>
                        </details>
                    </li>
                    <li class="logout">
                        <img src="../assets/img/logouticon.svg" alt="Sair">
                        <button class="btn-sair-conta open-modal" data-modal="modal-1">Sair</button>
                    </li>
                </ul>
            </nav>
        </aside>
    
        <!-- Formulário de Redefinição de Senha -->
        <main class="form-wrapper">

            <div class="form-container">

              <h2>Redefinição de senha</h2>

              <form>
                <div class="form-box">

                    <div class="form-group">
                        <label for="nova-senha">Nova senha</label>
                        <input type="password" id="nova-senha" placeholder="Crie uma senha" required>
                    </div>

                    <div class="form-group">
                        <label for="repetir-senha">Repetir senha</label>
                        <input type="password" id="repetir-senha" placeholder="Repita a senha criada" required>
                    </div>

                </div>

                <div class="form-buttons">
                    <button class="open-modal2" data-modal-2="meuModal2">Salvar</button>
                  <a href="../public/profile.html"><button type="button" class="btn-voltar">Voltar</button></a>
                </div>

              </form>

            </div>

        </main>

    </div>

    <!-- Modal Confirmação de Redefinição de Senha - Botão "Salvar" -->

    <!-- Modal -->
    <div class="modal-overlay hidden" id="modal-1">

        <div class="modal-box">

            <button class="modal-close close-modal" type="button">
                <i class="fa-solid fa-xmark"></i>
            </button>

            <div class="modal-subject">
                <div class="modal-header">
                    <p class="modal-title">Deseja mesmo <span>sair</span> da sua conta?</p>
                </div>

                <div class="modal-form">
                    <form action="#">
                        
                        <div class="sim-btn">
                            <a href="../public/login.html"><button type="button">Sim</button></a>
                        </div>

                        <div class="nao-btn">
                            <a href="../public/redefinir_senha.html"><button type="button">Não</button></a>
                        </div>

                    </form>

                </div>

            </div>
            
        </div>
        
    </div>
    <div id="meuModal2" class="modal2-overlay hidden">
        <div class="modal2-box">
            <button class="modal2-close close-modal2">&times;</button>
            <p class="modal-title">Deseja mesmo <span>redefinir</span> sua senha?</p>
            <div class="modal2-form">
                <form>
                    <div class="modal2-btn-sim">
                        <a href="recoverpassword.html"><button type="button">Sim</button></a>
                        
                    </div>
                    <div class="modal2-btn-nao">
                        <button type="button">Não</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    

    <script>
        document.querySelectorAll(".open-modal").forEach(button => {
            button.addEventListener("click", () => {
                const modalId = button.getAttribute("data-modal");
                document.getElementById(modalId).classList.remove("hidden");
            });
        });
    
        document.querySelectorAll(".close-modal").forEach(button => {
            button.addEventListener("click", () => {
                button.closest(".modal-overlay").classList.add("hidden");
            });
        });
    
        window.addEventListener("click", (e) => {
            if (e.target.classList.contains("modal-overlay")) {
                e.target.classList.add("hidden");
            }
        });
    </script>
    
    <script>

        document.querySelectorAll(".open-modal2").forEach(button => {
            button.addEventListener("click", () => {
                const modalId = button.getAttribute("data-modal-2");
                document.getElementById(modalId).classList.remove("hidden");
            });
        });
      
      
        document.querySelectorAll(".close-modal2").forEach(button => {
            button.addEventListener("click", () => {
                button.closest(".modal2-overlay").classList.add("hidden");
            });
        });
      
      
        window.addEventListener("click", (e) => {
            if (e.target.classList.contains("modal2-overlay")) {
                e.target.classList.add("hidden");
            }
        });
      
       
        document.querySelectorAll(".modal2-btn-sim").forEach(button => {
            button.addEventListener("click", () => {
                console.log("Sim clicado");
                button.closest(".modal2-overlay").classList.add("hidden");
            });
        });
      
        document.querySelectorAll(".modal2-btn-nao").forEach(button => {
            button.addEventListener("click", () => {
                console.log("Não clicado");
                button.closest(".modal2-overlay").classList.add("hidden");
            });
        });
      </script>
     
</body>
</html>
